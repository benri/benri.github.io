<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>benri apps</title>
    <meta name="description" content="Small web apps by benri. They run in your browser and keep your data on your device." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#f4efe6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141210" media="(prefers-color-scheme: dark)" />
    <style>
      :root {
        color-scheme: light;
        --bg: #f4efe6;
        --glow: rgba(232, 144, 44, 0.1);
        --ink: #1f1c19;
        --ink-2: #6a6158;
        --line: rgba(31, 28, 25, 0.12);
        --focus: #b45309;
        --icon-shadow: 0 1px 2px rgba(40, 28, 16, 0.18), 0 6px 18px rgba(40, 28, 16, 0.14);
        --icon-shadow-hover: 0 2px 4px rgba(40, 28, 16, 0.2), 0 12px 28px rgba(40, 28, 16, 0.2);
        --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial,
          sans-serif;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --bg: #141210;
          --glow: rgba(232, 144, 44, 0.07);
          --ink: #f3ece4;
          --ink-2: #a89c8f;
          --line: rgba(243, 236, 228, 0.12);
          --focus: #f0a33a;
          --icon-shadow: 0 1px 2px rgba(0, 0, 0, 0.5), 0 6px 18px rgba(0, 0, 0, 0.35);
          --icon-shadow-hover: 0 2px 4px rgba(0, 0, 0, 0.5), 0 12px 28px rgba(0, 0, 0, 0.5);
        }
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        background: radial-gradient(120% 60% at 50% 0%, var(--glow), transparent 70%), var(--bg);
        color: var(--ink);
        font-family: var(--font);
        font-size: 15px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom)
          env(safe-area-inset-left);
      }

      main {
        flex: 1;
        width: 100%;
        max-width: 680px;
        margin: 0 auto;
        padding: clamp(48px, 12vh, 112px) 16px 48px;
      }

      header {
        margin-bottom: clamp(40px, 8vh, 64px);
      }

      h1 {
        font-size: clamp(32px, 7vw, 44px);
        font-weight: 750;
        letter-spacing: -0.03em;
        line-height: 1.05;
      }

      .lede {
        margin-top: 10px;
        max-width: 40em;
        color: var(--ink-2);
      }

      /* ---------- the launcher grid ---------- */

      .apps {
        list-style: none;
        padding: 0;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(104px, 1fr));
        gap: 32px 12px;
      }

      .app {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        color: inherit;
        text-decoration: none;
        -webkit-tap-highlight-color: transparent;
      }

      .icon {
        display: block;
        width: 76px;
        height: 76px;
        border-radius: 18px;
        box-shadow: var(--icon-shadow);
        transition:
          transform 160ms ease,
          box-shadow 160ms ease;
      }

      .name {
        margin-top: 10px;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      .desc {
        margin-top: 1px;
        font-size: 12.5px;
        line-height: 1.35;
        color: var(--ink-2);
      }

      @media (min-width: 600px) {
        .apps {
          grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
        }
        .icon {
          width: 88px;
          height: 88px;
          border-radius: 21px;
        }
      }

      .app:hover .icon {
        transform: translateY(-3px);
        box-shadow: var(--icon-shadow-hover);
      }

      .app:active .icon {
        transform: scale(0.94);
        box-shadow: var(--icon-shadow);
      }

      .app:focus-visible {
        outline: none;
      }

      .app:focus-visible .icon {
        outline: 2.5px solid var(--focus);
        outline-offset: 3px;
      }

      @media (prefers-reduced-motion: reduce) {
        .icon {
          transition: none;
        }
        .app:hover .icon,
        .app:active .icon {
          transform: none;
        }
      }

      footer {
        width: 100%;
        max-width: 680px;
        margin: 0 auto;
        padding: 20px 16px 28px;
        border-top: 1px solid var(--line);
        font-size: 13px;
        color: var(--ink-2);
      }

      footer a {
        color: inherit;
        text-underline-offset: 2px;
      }

      footer a:hover {
        color: var(--ink);
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>benri</h1>
        <p class="lede">Small web apps. They run in your browser and keep your data on your device.</p>
      </header>

      <!-- To add an app: copy one <li>, then point it at /<repo-name>/ and an icon in icons/. -->
      <ul class="apps">
        <li>
          <a class="app" href="/flightdeck/">
            <img class="icon" src="/icons/flightdeck.svg" alt="" width="76" height="76" />
            <span class="name">flightdeck</span>
            <span class="desc">Range journal</span>
          </a>
        </li>
        <li>
          <a class="app" href="/cafflife/">
            <img class="icon" src="/icons/cafflife.svg" alt="" width="76" height="76" />
            <span class="name">cafflife</span>
            <span class="desc">Caffeine tracker</span>
          </a>
        </li>
      </ul>
    </main>

    <footer>
      <a href="https://github.com/benri">github.com/benri</a>
    </footer>
  </body>
</html>
